<!--
  Bloc « Le jour J » — l'écran signature d'EGIDE. Un seul élément doré par
  écran : ce bloc, quand un match est en cours. Le numéro de table est
  l'information qu'on cherche en marchant : 64 px, couleur texte (pas or —
  le doré fait le cadre, le chiffre fait le contraste).
-->
<style>

  .card { border-radius: 8px; padding: 16px; }

  .match { display: flex; align-items: center; gap: 16px; padding: 8px 0; }
  .col-table { min-width: 88px; }
  .label { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .table-no { font-size: 64px; line-height: 68px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .vsep { width: 1px; align-self: stretch; margin: 4px 0; }
  .opponent { font-size: 22px; line-height: 28px; font-weight: 700; }
  .faction { font-size: 13px; margin-top: 2px; }
  .divider { height: 1px; margin: 8px -16px; }
  .actions { display: flex; gap: 8px; }
  .action { flex: 1; min-height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .fresh { text-align: center; font-size: 12px; margin-top: 4px; }
